[workspace]
resolver = "3"
members = [
    "clotributor-apiserver",
    "clotributor-registrar",
    "clotributor-tracker",
]

[workspace.package]
version = "1.0.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
bincode = { version = "2.0.1", features = ["serde"] } # do-not-upgrade
clap = { version = "4.6.7", features = ["derive"] }
config = "0.15.27"
deadpool = "0.13.1"
deadpool-postgres = { version = "0.14.2", features = ["serde"] }
futures = "0.3.34"
graphql_client = { version = "0.16.0", features = ["reqwest"] }
hex = "0.4.3"
http = "1.5.0"
hyper = "1.12.0"
mime = "0.3.17"
mockall = "0.15.0"
mockito = "1.7.2"
openssl = { version = "0.10.82", features = ["vendored"] }
postgres-openssl = "0.5.3"
postgres-types = { version = "0.2.14", features = ["derive"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_qs = "1.1.3"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
time = { version = "0.3.55", features = [
    "formatting",
    "macros",
    "parsing",
    "serde",
] }
tokio = { version = "1.54.1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
tokio-postgres = { version = "0.7.18", features = [
    "with-time-0_3",
    "with-serde_json-1",
    "with-uuid-1",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["serde"] }
